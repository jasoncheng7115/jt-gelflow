<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="JT-GELFLOW">
  <defs>
    <linearGradient id="jgf-flow" x1="10" y1="0" x2="52" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#00ff88"/>
    </linearGradient>
    <radialGradient id="jgf-glow" cx="48" cy="32" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- dark tile, same base as the site / app background -->
  <rect width="64" height="64" rx="14" fill="#0a0e14"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#00d4ff" stroke-opacity="0.28" stroke-width="1.5"/>
  <!-- three GELF sources streaming into one collector -->
  <circle cx="48" cy="32" r="14" fill="url(#jgf-glow)"/>
  <g stroke="url(#jgf-flow)" stroke-width="5" stroke-linecap="round">
    <path d="M14 16 C 30 16, 32 32, 46 32"/>
    <path d="M14 32 L 46 32"/>
    <path d="M14 48 C 30 48, 32 32, 46 32"/>
  </g>
  <!-- source nodes -->
  <g fill="#00d4ff">
    <circle cx="13" cy="16" r="5.2"/>
    <circle cx="13" cy="32" r="5.2"/>
    <circle cx="13" cy="48" r="5.2"/>
  </g>
  <!-- collector node -->
  <circle cx="48" cy="32" r="8.5" fill="#00ff88"/>
  <circle cx="48" cy="32" r="3.4" fill="#0a0e14"/>
</svg>
